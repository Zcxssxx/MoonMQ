name: MoonMQ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Report toolchain
        run: moon version --all
      - name: Update dependencies
        run: moon update
      - name: Check
        run: moon check
      - name: Test
        run: moon test
      - name: Format check
        run: moon fmt --check
      - name: Native check
        run: moon check --target native
      - name: Native test
        run: moon test --target native
      - name: Native server build
        run: moon build --target native cmd/moonmq-server
